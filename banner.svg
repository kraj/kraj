<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Khem Raj — Embedded Linux &amp; Compiler Toolchain Engineer</title>
  <desc>A chip diagram on the left with four CPU cores, and a software stack on the right showing the embedded Linux layers from kernel up to applications, with skill badges along the bottom.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="chipgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#534AB7"/>
      <stop offset="100%" stop-color="#3C3489"/>
    </linearGradient>
    <linearGradient id="coregrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7F77DD"/>
      <stop offset="100%" stop-color="#534AB7"/>
    </linearGradient>
    <style>
      text { font-family: ui-monospace, 'Cascadia Code', 'Fira Mono', monospace; }
      .label-sm { font-size: 11px; fill: #CECBF6; }
      .label-md { font-size: 12px; font-weight: 500; }
      .layer-title { font-size: 13px; font-weight: 600; }
      .layer-sub   { font-size: 11px; }
      .badge-text  { font-size: 11px; font-weight: 500; }
    </style>
  </defs>

  <!-- background -->
  <rect width="680" height="420" rx="16" fill="#0D1117"/>

  <!-- subtle grid lines (PCB flavour) -->
  <line x1="340" y1="20" x2="340" y2="400" stroke="#ffffff" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="210" x2="680" y2="210" stroke="#ffffff" stroke-width="0.3" opacity="0.05"/>

  <!-- ── Left: SoC chip illustration ── -->

  <!-- PCB board outline -->
  <rect x="30" y="55" width="295" height="300" rx="10" fill="none" stroke="#534AB7" stroke-width="0.6" opacity="0.4" stroke-dasharray="6 4"/>

  <!-- chip package -->
  <rect x="68" y="90" width="215" height="215" rx="8" fill="url(#chipgrad)" opacity="0.95"/>

  <!-- die area -->
  <rect x="98" y="120" width="155" height="155" rx="4" fill="url(#coregrad)" opacity="0.9"/>

  <!-- core blocks -->
  <rect x="108" y="130" width="62" height="62" rx="3" fill="#EEEDFE" opacity="0.12"/>
  <rect x="181" y="130" width="62" height="62" rx="3" fill="#EEEDFE" opacity="0.12"/>
  <rect x="108" y="203" width="62" height="62" rx="3" fill="#EEEDFE" opacity="0.12"/>
  <rect x="181" y="203" width="62" height="62" rx="3" fill="#EEEDFE" opacity="0.12"/>

  <text class="label-sm" x="139" y="165" text-anchor="middle">Core 0</text>
  <text class="label-sm" x="212" y="165" text-anchor="middle">Core 1</text>
  <text class="label-sm" x="139" y="238" text-anchor="middle">Core 2</text>
  <text class="label-sm" x="212" y="238" text-anchor="middle">Core 3</text>

  <!-- chip label -->
  <text x="175" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#EEEDFE" font-family="ui-monospace, monospace">SoC</text>

  <!-- pins left -->
  <line x1="68" y1="130" x2="48" y2="130" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="150" x2="48" y2="150" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="170" x2="48" y2="170" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="190" x2="48" y2="190" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="210" x2="48" y2="210" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="230" x2="48" y2="230" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="250" x2="48" y2="250" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="270" x2="48" y2="270" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>

  <!-- pins right -->
  <line x1="283" y1="130" x2="303" y2="130" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="283" y1="150" x2="303" y2="150" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="283" y1="170" x2="303" y2="170" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="283" y1="190" x2="303" y2="190" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="283" y1="210" x2="303" y2="210" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="283" y1="230" x2="303" y2="230" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="283" y1="250" x2="303" y2="250" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="283" y1="270" x2="303" y2="270" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>

  <!-- pins top -->
  <line x1="128" y1="90" x2="128" y2="70" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="153" y1="90" x2="153" y2="70" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="178" y1="90" x2="178" y2="70" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="203" y1="90" x2="203" y2="70" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="228" y1="90" x2="228" y2="70" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>

  <!-- pins bottom -->
  <line x1="128" y1="305" x2="128" y2="325" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="153" y1="305" x2="153" y2="325" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="178" y1="305" x2="178" y2="325" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="203" y1="305" x2="203" y2="325" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="228" y1="305" x2="228" y2="325" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>

  <!-- connector chip → stack -->
  <path d="M 325 197 L 352 197" stroke="#534AB7" stroke-width="1" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- ── Right: software stack layers ── -->

  <!-- header -->
  <text x="365" y="80" font-size="13" font-weight="700" fill="#AFA9EC" font-family="ui-monospace, monospace">Embedded Linux Stack</text>

  <!-- Layer 1: Apps — teal -->
  <rect x="358" y="96" width="288" height="44" rx="6" fill="#085041" stroke="#0F6E56" stroke-width="0.8"/>
  <text class="layer-title" x="502" y="115" text-anchor="middle" fill="#9FE1CB" font-family="ui-monospace, monospace">Applications &amp; userspace</text>
  <text class="layer-sub"  x="502" y="131" text-anchor="middle" fill="#5DCAA5" font-family="ui-monospace, monospace">Qt5 · Chromium · OpenWRT</text>

  <!-- Layer 2: Distro — blue -->
  <rect x="358" y="150" width="288" height="44" rx="6" fill="#0C447C" stroke="#185FA5" stroke-width="0.8"/>
  <text class="layer-title" x="502" y="169" text-anchor="middle" fill="#B5D4F4" font-family="ui-monospace, monospace">Distribution layer</text>
  <text class="layer-sub"  x="502" y="185" text-anchor="middle" fill="#85B7EB" font-family="ui-monospace, monospace">Yoe Distro · Ångström · musl/glibc</text>

  <!-- Layer 3: Build system — purple -->
  <rect x="358" y="204" width="288" height="44" rx="6" fill="#26215C" stroke="#534AB7" stroke-width="0.8"/>
  <text class="layer-title" x="502" y="223" text-anchor="middle" fill="#CECBF6" font-family="ui-monospace, monospace">Build system</text>
  <text class="layer-sub"  x="502" y="239" text-anchor="middle" fill="#AFA9EC" font-family="ui-monospace, monospace">Yocto · OpenEmbedded · BitBake</text>

  <!-- Layer 4: Compiler — amber -->
  <rect x="358" y="258" width="288" height="44" rx="6" fill="#412402" stroke="#854F0B" stroke-width="0.8"/>
  <text class="layer-title" x="502" y="277" text-anchor="middle" fill="#FAC775" font-family="ui-monospace, monospace">Compiler toolchain</text>
  <text class="layer-sub"  x="502" y="293" text-anchor="middle" fill="#EF9F27" font-family="ui-monospace, monospace">Clang/LLVM · GCC · binutils</text>

  <!-- Layer 5: Kernel / HW — coral -->
  <rect x="358" y="312" width="288" height="44" rx="6" fill="#4A1B0C" stroke="#993C1D" stroke-width="0.8"/>
  <text class="layer-title" x="502" y="331" text-anchor="middle" fill="#F5C4B3" font-family="ui-monospace, monospace">Linux kernel + BSP</text>
  <text class="layer-sub"  x="502" y="347" text-anchor="middle" fill="#F0997B" font-family="ui-monospace, monospace">ARM · AArch64 · RISC-V · x86</text>

  <!-- ── Bottom: skill badges ── -->
  <!-- purple -->
  <rect x="30"  y="378" width="92" height="22" rx="11" fill="#26215C" stroke="#534AB7" stroke-width="0.8"/>
  <text class="badge-text" x="76"  y="392" text-anchor="middle" fill="#CECBF6" font-family="ui-monospace, monospace">Yocto Project</text>

  <!-- blue -->
  <rect x="130" y="378" width="92" height="22" rx="11" fill="#042C53" stroke="#185FA5" stroke-width="0.8"/>
  <text class="badge-text" x="176" y="392" text-anchor="middle" fill="#B5D4F4" font-family="ui-monospace, monospace">OpenEmbedded</text>

  <!-- amber -->
  <rect x="230" y="378" width="80" height="22" rx="11" fill="#412402" stroke="#854F0B" stroke-width="0.8"/>
  <text class="badge-text" x="270" y="392" text-anchor="middle" fill="#FAC775" font-family="ui-monospace, monospace">Clang/LLVM</text>

  <!-- teal -->
  <rect x="318" y="378" width="62" height="22" rx="11" fill="#04342C" stroke="#0F6E56" stroke-width="0.8"/>
  <text class="badge-text" x="349" y="392" text-anchor="middle" fill="#9FE1CB" font-family="ui-monospace, monospace">RISC-V</text>

  <!-- coral -->
  <rect x="388" y="378" width="50" height="22" rx="11" fill="#4A1B0C" stroke="#993C1D" stroke-width="0.8"/>
  <text class="badge-text" x="413" y="392" text-anchor="middle" fill="#F5C4B3" font-family="ui-monospace, monospace">musl</text>

  <!-- green -->
  <rect x="446" y="378" width="62" height="22" rx="11" fill="#173404" stroke="#3B6D11" stroke-width="0.8"/>
  <text class="badge-text" x="477" y="392" text-anchor="middle" fill="#C0DD97" font-family="ui-monospace, monospace">BitBake</text>

  <!-- gray -->
  <rect x="516" y="378" width="44" height="22" rx="11" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8"/>
  <text class="badge-text" x="538" y="392" text-anchor="middle" fill="#D3D1C7" font-family="ui-monospace, monospace">GCC</text>

  <!-- pink -->
  <rect x="568" y="378" width="82" height="22" rx="11" fill="#4B1528" stroke="#993556" stroke-width="0.8"/>
  <text class="badge-text" x="609" y="392" text-anchor="middle" fill="#F4C0D1" font-family="ui-monospace, monospace">meta-clang</text>
</svg>
